# Lint and run the tests on every push and pull request.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install SwingCheck
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check swingcheck tests
      - name: Test
        run: pytest -q
