<!doctype html>
<!-- Link preview (Open Graph, 1200x630): the image Messenger, Facebook, Viber, etc. show for a
     swingcheck.org link. Render with branding/render.sh -> swingcheck/app/static/og-image.png.
     Content stays centered: some apps crop the sides to a square. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>SwingCheck link preview</title>
<style>
  :root { --accent: #2b7a47; --deep: #123824; --ok: #58b874; --warn: #e3a83f; --flag: #ee6b63; --plane: #ff9f43; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    color: #fff;
    background:
      radial-gradient(900px 560px at 50% 125%, rgba(88, 184, 116, 0.35), transparent 70%),
      linear-gradient(160deg, #1d5a37 0%, var(--deep) 100%);
  }
  svg.art { position: absolute; inset: 0; }
  .content {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    text-align: center;
  }
  .brand { display: flex; align-items: center; gap: 22px; }
  .brand svg { width: 84px; height: 84px; }
  .name { font-size: 96px; font-weight: 750; letter-spacing: -0.035em; line-height: 1; }
  .tagline { font-size: 36px; font-weight: 500; opacity: 0.92; letter-spacing: -0.005em; }
  .dots { display: flex; gap: 12px; margin-top: 10px; }
  .dot {
    width: 44px; height: 44px; border-radius: 50%;
    display: grid; place-items: center;
    font-size: 21px; font-weight: 700; color: #fff;
    box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.14);
  }
  .ok { background: var(--ok); } .warn { background: var(--warn); } .flag { background: var(--flag); }
  .eyebrow { font-size: 22px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #4fb06d; }
  .free { font-size: 20px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.7; }
</style>
</head>
<body>
  <!-- Swing plane lines and a hand-path arc, faint, behind the text. -->
  <svg class="art" viewBox="0 0 1200 630" aria-hidden="true">
    <g fill="none" stroke-linecap="round">
      <line x1="-40" y1="600" x2="230" y2="-30" stroke="var(--plane)" stroke-width="4" opacity="0.55"/>
      <line x1="-90" y1="550" x2="170" y2="-60" stroke="#fff" stroke-width="2" opacity="0.16"/>
      <line x1="20" y1="660" x2="290" y2="30" stroke="#fff" stroke-width="2" opacity="0.16"/>
      <path d="M960 600 C 1000 450, 1080 330, 1190 290" stroke="#fff" stroke-width="3" stroke-dasharray="2 14" opacity="0.4"/>
      <path d="M935 660 C 985 460, 1080 300, 1240 250" stroke="var(--plane)" stroke-width="4" opacity="0.55"/>
    </g>
  </svg>

  <div class="content">
    <div class="eyebrow">Nothing fancy, just geometry</div>
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="15" fill="#fff" opacity="0.16"/>
        <circle cx="16" cy="16" r="11" fill="#fff"/>
        <circle cx="13" cy="13.5" r="1.3" fill="#c9cec6"/><circle cx="18.5" cy="12.5" r="1.3" fill="#c9cec6"/>
        <circle cx="15.5" cy="18.5" r="1.3" fill="#c9cec6"/><circle cx="20" cy="17.5" r="1.3" fill="#c9cec6"/>
      </svg>
      <div class="name">SwingCheck</div>
    </div>
    <div class="tagline">Film it. Check it. Fix what matters.</div>
    <div class="dots">
      <span class="dot ok">1</span><span class="dot ok">2</span><span class="dot warn">3</span><span class="dot ok">4</span>
      <span class="dot flag">5</span><span class="dot ok">6</span><span class="dot warn">7</span><span class="dot ok">8</span>
    </div>
    <div class="free">Free golf swing checker</div>
  </div>
</body>
</html>
