<!doctype html>
<!-- Instagram story (1080x1920): SwingCheck's first month, from the server's event log
     (Oct 5-29, 2026) and git. Render with headless Edge:
       msedge --headless --hide-scrollbars --force-device-scale-factor=1 --window-size=1080,1920
              --screenshot=instagram-month-one.png instagram-month-one.html
     The top and bottom ~250 px stay clear of text: Instagram puts its own buttons there. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>SwingCheck month one</title>
<style>
  :root { --deep: #123824; --ok: #58b874; --warn: #e3a83f; --flag: #ee6b63; --plane: #ff9f43; --bright: #4fb06d; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; }
  body {
    position: relative;
    font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    color: #fff;
    background:
      radial-gradient(1200px 900px at 50% 112%, rgba(88, 184, 116, 0.38), transparent 70%),
      linear-gradient(165deg, #1d5a37 0%, var(--deep) 62%, #0d2a1b 100%);
  }
  svg.art { position: absolute; inset: 0; }
  .content {
    position: absolute; left: 80px; right: 80px; top: 250px; bottom: 270px;
    display: flex; flex-direction: column; align-items: center; text-align: center;
  }
  .brand { display: flex; align-items: center; gap: 20px; }
  .brand svg { width: 76px; height: 76px; }
  .name { font-size: 78px; font-weight: 750; letter-spacing: -0.035em; line-height: 1; }
  .eyebrow { margin-top: 36px; font-size: 30px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--bright); }
  h1 { margin: 10px 0 0; font-size: 82px; font-weight: 750; letter-spacing: -0.035em; line-height: 1.02; }
  .grid { margin-top: 44px; width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
  .stat {
    padding: 26px 18px 24px; border-radius: 30px;
    background: rgba(255, 255, 255, 0.07); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.09);
  }
  .num { font-size: 92px; font-weight: 750; letter-spacing: -0.04em; line-height: 1; }
  .num small { font-size: 54px; font-weight: 700; letter-spacing: -0.02em; }
  .label { margin-top: 8px; font-size: 29px; font-weight: 500; line-height: 1.25; opacity: 0.88; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .plane { color: var(--plane); }
  .new {
    margin-top: 40px; display: inline-flex; align-items: center; gap: 16px;
    padding: 18px 34px; border-radius: 999px; background: var(--plane); color: #1a1d19;
    font-size: 36px; font-weight: 700; letter-spacing: -0.01em;
  }
  .new b { font-size: 24px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase;
    padding: 6px 14px; border-radius: 999px; background: rgba(26, 29, 25, 0.14); }
  .foot { margin-top: auto; padding-top: 36px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .thanks { font-size: 40px; font-weight: 600; letter-spacing: -0.01em; }
  .free { font-size: 26px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; opacity: 0.7; }
  .url { font-size: 46px; font-weight: 750; letter-spacing: -0.02em; color: var(--bright); }
</style>
</head>
<body>
  <!-- Swing plane lines and a hand-path arc, faint, behind the text (as on the link preview). -->
  <svg class="art" viewBox="0 0 1080 1920" aria-hidden="true">
    <g fill="none" stroke-linecap="round">
      <line x1="-60" y1="1180" x2="330" y2="-40" stroke="var(--plane)" stroke-width="5" opacity="0.4"/>
      <line x1="-120" y1="1120" x2="260" y2="-80" stroke="#fff" stroke-width="2" opacity="0.12"/>
      <line x1="0" y1="1240" x2="390" y2="20" stroke="#fff" stroke-width="2" opacity="0.12"/>
      <path d="M830 1960 C 880 1700, 980 1520, 1120 1460" stroke="#fff" stroke-width="3" stroke-dasharray="2 16" opacity="0.35"/>
      <path d="M800 2000 C 860 1700, 980 1480, 1160 1400" stroke="var(--plane)" stroke-width="5" opacity="0.45"/>
    </g>
  </svg>

  <div class="content">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="15" fill="#fff" opacity="0.16"/>
        <circle cx="16" cy="16" r="11" fill="#fff"/>
        <circle cx="13" cy="13.5" r="1.3" fill="#c9cec6"/><circle cx="18.5" cy="12.5" r="1.3" fill="#c9cec6"/>
        <circle cx="15.5" cy="18.5" r="1.3" fill="#c9cec6"/><circle cx="20" cy="17.5" r="1.3" fill="#c9cec6"/>
      </svg>
      <div class="name">SwingCheck</div>
    </div>

    <div class="eyebrow">Month one</div>
    <h1>Our first month<br>on the range</h1>

    <div class="grid">
      <div class="stat"><div class="num">387</div><div class="label">swings uploaded</div></div>
      <div class="stat"><div class="num ok">366</div><div class="label">swings analyzed</div></div>
      <div class="stat"><div class="num">86</div><div class="label">golfers on our<br>busiest day</div></div>
      <div class="stat"><div class="num warn">33<small>s</small></div><div class="label">typical time<br>to results</div></div>
      <div class="stat"><div class="num">59</div><div class="label">updates<br>shipped</div></div>
      <div class="stat"><div class="num plane">13</div><div class="label">checkpoints<br>across 2 views</div></div>
    </div>

    <div class="new"><b>New</b> Face-on analysis</div>

    <div class="foot">
      <div class="thanks">Thank you for swinging with us.</div>
      <div class="free">Free · No sign-up</div>
      <div class="url">swingcheck.org</div>
    </div>
  </div>
</body>
</html>
