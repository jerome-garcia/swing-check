# swingcheck default configuration.
#
# Don't edit this file to tune: copy any keys you want to change into
# config/local.toml (gitignored). Values there override these.
#
# Distances marked "body units" are divided by the body scale measured on the
# address frame (see [scale]), so they don't depend on camera distance.

[golfer]
handedness = "right"          # "right" | "left"; the app sets it per swing (upload page)
club = "iron"                 # "iron" (irons and wedges) | "driver" (driver and woods); per swing too
# Target direction in the frame. "auto" infers it from handedness and view:
#   fo  (camera facing golfer): right-handed -> target is screen-right
#   dtl (camera behind golfer, looking at target): target is into the screen
target_direction_fo = "auto"  # "auto" | "left" | "right"
# Your torso length in cm (hip joint to shoulder joint, about belt line to the
# top of the shoulder). Distances are measured as a share of your torso length;
# this only turns them into rough centimetres for display.
torso_cm = 50

[ingest]
# Downscale used for pose extraction only (annotated output stays full-res).
pose_max_height = 1080
# Re-encode quality for the normalized clip (libx264 CRF; lower = better).
crf = 18
# A keyframe every this many frames. The marking screen jumps around the video, and
# each jump decodes from the keyframe before it: x264's default (250) made a jump
# cost 250-450 ms on a 2-CPU server. 15 keeps it short, for 1.5-2x the file size.
keyframe_interval = 15
# Warn if a clip's capture fps is at or below this (likely a flattened slo-mo).
low_fps_warning = 60

[trim]
# Auto-trim for high frame rate clips: a quick pose pass at coarse_fps over
# the whole clip finds the swing, then every frame is processed only from
# pad_before_s before address to pad_after_s after impact.
enabled = true
coarse_fps = 30
pad_before_s = 0.75
pad_after_s = 0.75

[camera_check]
# A quick check of the camera after upload (swingcheck/camera_check.py), shown on the
# marking screen. Spreads are left-right distances as a share of torso length.
# Down-the-line clips measure 0.03-0.21 (shoulders and hips overlap from behind);
# straight face-on is roughly 0.7.
side_on_warn = 0.35           # above this: "the camera may be off to one side"
side_on_flag = 0.55           # above this: "doesn't look like a down-the-line view"
min_height = 0.20             # golfer (head to ankles) under this share of the frame: "small"
edge_margin = 0.02            # head or feet this close to the frame edge: cut off
min_visibility = 0.5          # tracker confidence below this: hidden / hard to see

[pose]
model = "heavy"               # "lite" | "full" | "heavy"
min_detection_confidence = 0.5
min_tracking_confidence = 0.5
# Landmarks below this visibility are treated as missing.
min_visibility = 0.5
# Wrists use a lower bar: the hands are weighted by visibility and averaged,
# and in DTL the lead wrist is often partly hidden but still roughly right.
hand_min_visibility = 0.3
# Both hands are on the grip, so the wrists should be close. Farther apart
# than this (torso lengths) means one is mis-tracked; the one continuing the
# hand path's motion is used.
hand_max_separation = 0.15
# Direction of travel for that choice is averaged over this window.
hand_velocity_window_ms = 50
# A hand position this far (torso lengths) from where the path was heading is
# treated as a tracking glitch and interpolated over.
hand_max_jump = 0.4
# Gaps in a keypoint track shorter than this are filled by interpolation.
max_gap_ms = 100
# Smoothing window for keypoint trajectories, in milliseconds (0 = off).
smoothing_ms = 25

[scale]
# Body measure taken on the address frame: "torso" (shoulder-mid to hip-mid)
# or "shoulder_width". Torso is the default because shoulder width is
# heavily foreshortened in DTL.
method = "torso"
# Median over this window around the address frame, so one noisy frame doesn't skew it.
window_ms = 200

[phases]
# Phases come from the hand path's shape, with speeds relative to the clip's
# own peak hand speed, so they work for real-time and slowed-down clips alike.
#
# Address: the last still moment before the takeaway. Hands count as "still"
# below this fraction of the clip's peak hand speed...
still_speed_fraction = 0.03
# ...for at least this long.
still_min_ms = 150
# Address is the last frame before the hands move this far (body units) from
# where they rested.
address_move_tolerance = 0.03
# A takeaway often starts slower than "still": from there, address goes back while
# the hands were at least this much farther away (body units) this long before...
address_settle_ms = 100
address_settle_tolerance = 0.004
# ...and then this much earlier again, so it lands before the swing has started.
address_margin_ms = 100
# Extra smoothing applied to the hand path for phase detection only.
smoothing_ms = 40
# The downswing's lowest hand point is searched until the hands have risen
# this far (body units) back up from it, so small tracking wobbles don't
# stop the search early.
bottom_rise_tolerance = 0.08
# Impact is the middle of the frames where the hands are within this distance
# (body units) of their lowest point in the downswing.
impact_plateau_tolerance = 0.01
# Shift detected impact by this many milliseconds (+ = later). The hands
# bottom out slightly before contact for many players; if impact lands
# consistently early or late on your clips, correct it here.
impact_offset_ms = 0
# Top search starts where the hands were last at impact height before the
# downswing, give or take this tolerance (body units).
low_level_tolerance = 0.15
# Takeaway checkpoint: when the shaft is about parallel to the target line. The
# hands first move back (mostly away from a down-the-line camera), then up, so this
# is the frame where they've covered this fraction of their path from address to
# the top; tuned on seven clips (McIlroy, Tiger, Morikawa, and four amateurs), all
# within about a frame. A takeaway frame you mark replaces it.
takeaway_fraction = 0.12
# Halfway back (lead arm parallel to the ground), suggested on the marking screen: where
# the hands have risen this fraction of the way from address height to top height.
# Tuned on the same seven clips: within a frame on six, McIlroy (club set early,
# hands low) about 0.1 s early.
halfway_back_fraction = 0.45
# Early downswing checkpoint: where the hands come back down past this height, as a
# fraction of the way from address hand height up to top hand height.
downswing_fraction = 0.35

[analyzers]
# Names of analyzers to skip, e.g. ["head_drift"].
disabled = []

[analyzers.address]
# DTL address posture, measured on the frame you mark on, using the
# camera-side (trail side) body points. Angles in degrees.
#
# Every measurement has three bands: green (good), yellow (watch: just
# outside good) and red (flag: beyond the yellow band).
#
# Arms hang straight down: shoulder->wrist line, degrees from vertical
# (either way). Green within arm_max_from_vertical, yellow up to arm_watch_max.
arm_max_from_vertical = 10
arm_watch_max = 15
# Spine forward bend: hip-center->shoulder-center line, degrees from vertical.
spine_bend_min = 30
spine_bend_max = 45
spine_bend_watch_min = 25
spine_bend_watch_max = 50
# Knee flex: 180 minus the hip-knee-ankle angle (0 = straight leg).
knee_flex_min = 15
knee_flex_max = 35
knee_flex_watch_min = 10
knee_flex_watch_max = 40
# Back rounding: how far the outline of your back bulges out from a straight
# line between hip and shoulder level, as a share of torso length (0.06 = 6%;
# from the body silhouette, loose clothing can add to it).
back_bulge_max = 0.06
back_bulge_watch_max = 0.09

[analyzers.swing_plane]
# DTL checkpoint 2, on the address frame: the line through the clicked
# clubhead (hosel) and grip.
#
# Key check: extended up past the hands, the line should point roughly at the
# belt buckle. Measured as where it crosses the torso, as a share of the way
# from hip center (0) to shoulder center (1, i.e. 100%).
# The swing plane later checkpoints use runs from the clubhead toward the belt
# buckle: the shaft line if it points inside this green zone, else the line to its
# nearest edge.
belt_min = 0.0     # green 0-45% up the torso
belt_max = 0.45
belt_watch_min = -0.10   # yellow from 10% below the hips...
belt_watch_max = 0.60    # ...to 60% up; beyond: red (too flat / too upright)
# Shaft angle from horizontal, degrees. Typical by club: driver 45-50,
# mid-irons 50-55, short irons/wedges 55-65. Camera height also shifts it.
angle_min = 45
angle_max = 65
angle_watch_min = 40
angle_watch_max = 70

[analyzers.takeaway]
# DTL checkpoint 3, on the takeaway frame you mark (shaft parallel to the
# target line): the clubhead should still be on the address shaft line (the
# club is on plane). Distance from that line, square to it, as a share of
# torso length (0.20 = 20%, about 10 cm).
line_tolerance = 0.20          # green: on plane, up to this toward you (inside)...
line_tolerance_outside = 0.40  # ...and up to this toward the ball (about 20 cm; Tiger
                               # takes it back about 18 cm outside)
flag_distance = 0.50    # yellow up to this (slightly inside/outside, which many
                        # good players do); red beyond (well inside/outside)
# Body kept from address, degrees. Spine bend (hip center -> shoulder center
# from vertical): lost = standing up early. McIlroy loses about 2°, Tiger 5.5°.
posture_loss_max = 6       # green up to 6° more upright...
posture_loss_watch = 10    # ...yellow to 10°; red beyond (standing up)
posture_gain_max = 5       # green up to 5° more bent...
posture_gain_watch = 10    # ...yellow to 10°; red beyond (bending over)
# Trail knee flex (180 - hip-knee-ankle angle): lost = the trail leg
# straightening. McIlroy about 3° straighter, Tiger about 2° more bent.
knee_straighten_max = 5    # green up to 5° straighter...
knee_straighten_watch = 10 # ...yellow to 10°; red beyond (locking out)
knee_bend_max = 8          # green up to 8° more bent...
knee_bend_watch = 15       # ...yellow to 15°; red beyond (sinking)

[analyzers.halfway_back]
# DTL checkpoint 4, on the frame you mark where the lead arm is parallel to the
# ground. Distances as a share of torso length (0.10 = 10%, about 5 cm).
#
# Shaft points: the clubhead->hands line carried down to the ball's level.
# + = lands inside the ball (between the ball and your feet), - = past it.
inside_min = -0.10        # green: 10% past the ball to 40% inside
inside_max = 0.40
inside_watch_min = -0.25  # yellow: up to 25% past the ball (a little flat)...
inside_watch_max = 0.70   # ...or 40-70% inside (toward your feet, a little steep); red beyond
# Body kept from address, degrees (as at the takeaway, a little looser: the
# spine bend eases a little as the shoulders turn). McIlroy loses about 4° of
# spine bend and 4° of trail knee flex by here, Tiger 6° and 2°.
posture_loss_max = 8       # green up to 8° more upright...
posture_loss_watch = 12    # ...yellow to 12°; red beyond (standing up)
posture_gain_max = 5       # green up to 5° more bent...
posture_gain_watch = 10    # ...yellow to 10°; red beyond (bending over)
knee_straighten_max = 6    # green up to 6° straighter...
knee_straighten_watch = 10 # ...yellow to 10°; red beyond (locking out)
knee_bend_max = 8          # green up to 8° more bent...
knee_bend_watch = 15       # ...yellow to 15°; red beyond (sinking)

[analyzers.top]
# DTL checkpoint 5, on the top frame you mark.
#
# Lead arm (lead shoulder -> hands) vs spine (hip center -> head), degrees.
# 90 = the arm matches the shoulders. Under = arm lifted above the shoulder
# plane (upright); over = below it (flat, around the body). Seen from behind,
# the lead arm points partly at the camera, so the green band is generous.
arm_spine_min = 75
arm_spine_max = 105
arm_spine_watch_min = 65
arm_spine_watch_max = 115
# Hands vs the trail heel, across the picture, as a share of torso length:
# the hands should sit straight above the trail heel. + = out toward the ball,
# - = behind the heel (deep). McIlroy +3%, Tiger +11%.
heel_max = 0.15    # green within ±15% (about 7 cm)...
heel_watch = 0.30  # ...yellow to 30% (about 15 cm); red beyond
# Spine bend kept from address, degrees (as at halfway back). McIlroy is back at
# his address bend by the top, Tiger about 4° more upright.
posture_loss_max = 8       # green up to 8° more upright...
posture_loss_watch = 12    # ...yellow to 12°; red beyond (standing up)
posture_gain_max = 5       # green up to 5° more bent...
posture_gain_watch = 10    # ...yellow to 10°; red beyond (bending over)

[analyzers.downswing]
# DTL checkpoint 6, on the frame you mark where the shaft is parallel to the
# ground coming down (P6). Distances as a share of torso length.
#
# Clubhead vs the address shaft line, square to it: + = behind the line (under
# the plane, the golfer's side), - = above it (over the top).
under_min = -0.10       # green: 10% above (on the line, give or take a click: Tiger -1%) to 40% under
under_max = 0.40
under_watch_min = -0.30 # yellow: 10-30% above (slightly steep; a little above is forgivable) or 40-70% under (very
under_watch_max = 0.70  # shallow); red beyond (over the top / stuck)
# Shallowing: that distance minus the same one at your takeaway. + = the club
# comes down flatter than it went back.
shallow_min = 0.0         # green: as flat or flatter coming down
shallow_watch_min = -0.20 # yellow: up to 20% steeper; red beyond (over the top loop)
# Spine bend kept from address, degrees. Good players hold it coming down
# (McIlroy about 1° more upright, Tiger 2° more bent); losing it here is where
# standing up / early extension starts.
posture_loss_max = 5       # green up to 5° more upright...
posture_loss_watch = 10    # ...yellow to 10°; red beyond (standing up)
posture_gain_max = 5       # green up to 5° more bent...
posture_gain_watch = 10    # ...yellow to 10°; red beyond (bending over)

[analyzers.impact]
# DTL checkpoint 7, automatic on the detected impact frame.
#
# Tush line: the rear edge of the hips (body outline at hip height) at impact
# vs address, as a share of torso length; + = moved toward the ball (early
# extension).
# Good players often move a few cm toward the ball as the hips turn through;
# around 3 inches (7-8 cm) is where early extension is usually called.
hips_forward_max = 0.10    # green up to 10% (about 5 cm) toward the ball, or any amount back
hips_forward_watch = 0.15  # yellow to 15% (about 7.5 cm); red beyond
# Spine bend kept from address, degrees. Lost = more upright at impact. Good
# players lose a few degrees as the hips open (McIlroy about 7°), so only a big
# loss counts as standing up.
posture_loss_max = 10      # green up to 10° more upright...
posture_loss_watch = 15    # ...yellow to 15°; red beyond (standing up)
posture_gain_max = 6       # green up to 6° more bent...
posture_gain_watch = 12    # ...yellow to 12°; red beyond (dipping)

[analyzers.follow_through]
# DTL checkpoint 8, on the frame you mark where the trail arm is parallel to
# the ground after impact. Distances as a share of torso length.
#
# Bands are loose on purpose: the ball is gone by now, so the follow-through mostly
# reflects what came before. Only a clearly off exit turns red, and its rows rank
# low for "Work on first" (swingcheck/priority.py).
#
# Shaft points: the clubhead->hands line carried down to the ball's level.
# + = lands inside the ball (between the ball and your feet), - = past it.
# Good players often exit a little flat (Tiger about 28 cm past the ball), so green
# reaches further past the ball than toward the feet.
inside_min = -0.70        # green: 70% past the ball (about 35 cm) to 75% inside
inside_max = 0.75
inside_watch_min = -1.00  # yellow: to 100% past (a little flat) or 110% inside
inside_watch_max = 1.10   # (a little steep); red beyond
# Same line as the backswing: this landing vs the halfway-back one, either way.
# Good players differ by up to about 25% (McIlroy 21% steeper, the reference
# photo 14-24% flatter); club golfers often by ~50% (Jolo 51%). Red is for a
# clearly different line, like the 117% steeper exit after a laid-off backswing.
# Pros lean flatter on the way through (Tiger 34 cm, Morikawa 26 cm, McIlroy 11 cm),
# so a flatter exit gets more room than a steeper one.
same_line_max = 0.60      # green up to 60% steeper...
same_line_watch = 1.00    # ...yellow to 100%; red beyond
same_line_flatter_max = 0.90    # green up to 90% flatter (about 45 cm)...
same_line_flatter_watch = 1.30  # ...yellow to 130%; red beyond

[analyzers.hands_at_impact]
# Lead wrist x minus ball x along the target direction, body units.
ahead_threshold = 0.10        # >= this -> "ahead" (good shaft lean)
behind_threshold = -0.05      # <= this -> "behind" (scoop signal)

[analyzers.weight_shift]
# Hip-center movement toward the target, address -> impact, body units.
min_shift = 0.15              # less than this -> flagged (fat-shot / low-point risk)

[analyzers.head_drift]
# Head x movement away from the target, address -> impact, body units.
max_drift_away = 0.10         # more than this -> flagged

[output]
# Draw the hand path (wrist trail) on the video and key frames. Off for now:
# no current check uses it and wrist tracking makes it jittery. A future
# checkpoint (e.g. downswing shallowing) may turn it back on, smoothed.
show_hand_path = false
# How much hand path to draw behind the current frame; 0 = all of it since address.
trail_length_ms = 0
# Phases saved as images (any of address, takeaway, top, early_downswing, impact).
freeze_frames = ["address", "top", "impact"]
# The annotated video plays at most this many frames per second, so a 240 fps
# clip comes out as 4x slow motion at 60.
max_playback_fps = 60
# The annotated video is drawn at full size, then saved at most this wide (0 = full
# size) at this quality (libx264 CRF; lower = better). 720 at 23 looks the same on
# screen as full size at 20 and is about a third of the size (6.8 -> 2.1 MB on a
# 5 s clip), so it plays without stalling on a slow connection. Video only: the key
# frames and the analysis use full-size frames.
video_max_width = 720
video_crf = 23

[hosted]
# Only used when the app runs on a public server (`swingcheck --hosted`); see
# swingcheck/app/hosted.py. Each visitor sees only their own swings.
max_swings = 4                # swings a visitor can keep; delete one to add another
keep_days = 3                 # swings are deleted this long after upload
max_upload_mb = 95            # largest video file accepted; under Cloudflare free plan's 100 MB upload cap
max_clip_seconds = 20         # longest clip accepted (real time, as the phone recorded it)
max_queued_jobs = 10          # conversions/analyses waiting; past this, "busy, try again"
# Uploads per IP address in 24 hours, so clearing cookies (a fresh owner key, so a fresh
# swing limit) can't be used to upload without end. Counted in memory only.
max_uploads_per_ip_per_day = 12

[clubs.driver]
# A driver (or wood) changes the set-up: you stand taller, the hands sit further
# out, and the shaft is flatter. These replace the matching iron settings above
# for a swing marked "Driver or wood". Set by hand for now (no pro driver clip
# to tune against yet).
[clubs.driver.analyzers.address]
spine_bend_min = 25         # green 25-40 degrees (irons 30-45)
spine_bend_max = 40
spine_bend_watch_min = 20
spine_bend_watch_max = 45
arm_max_from_vertical = 20  # arms a bit forward: green up to 20 degrees out (irons 10)
arm_watch_max = 25
[clubs.driver.analyzers.swing_plane]
angle_min = 35              # flatter shaft: green 35-55 degrees (irons 45-65)
angle_max = 55
angle_watch_min = 30
angle_watch_max = 60
