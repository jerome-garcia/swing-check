[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swingcheck"
version = "0.1.0"
description = "Local golf swing analyzer: pose-based checks for DTL and face-on clips."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "mediapipe>=0.10.14",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "fpdf2>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.27"]

[project.scripts]
swingcheck = "swingcheck.app.__main__:main"

[tool.setuptools.packages.find]
include = ["swingcheck*"]

[tool.setuptools.package-data]
"swingcheck.app" = ["static/*", "static/reference/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
