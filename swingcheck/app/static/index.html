<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SwingCheck</title>
  <meta name="theme-color" content="#2b7a47">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='12' fill='%23fff' stroke='%23333' stroke-width='2'/><circle cx='12' cy='13' r='1.5' fill='%23999'/><circle cx='18' cy='12' r='1.5' fill='%23999'/><circle cx='15' cy='19' r='1.5' fill='%23999'/></svg>">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand" aria-label="SwingCheck: your swings">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="14" fill="var(--accent)"/>
        <circle cx="16" cy="16" r="9.5" fill="#fff"/>
        <circle cx="13" cy="13.5" r="1.3" fill="#c9cec6"/><circle cx="18.5" cy="12.5" r="1.3" fill="#c9cec6"/>
        <circle cx="15.5" cy="18.5" r="1.3" fill="#c9cec6"/><circle cx="20" cy="17.5" r="1.3" fill="#c9cec6"/>
      </svg>
      SwingCheck
    </a>
    <a href="#/new" class="btn primary" id="new-swing-btn">New swing</a>
  </header>
  <main id="view" aria-live="polite"></main>
  <footer class="site-footer" id="support" hidden>
    <div class="support-card">
      <div class="support-intro">
        <h2>Enjoying SwingCheck?</h2>
        <p>It's free to use. If it helps your game, a small tip helps cover the server costs and keeps it going.</p>
      </div>
      <div class="support-option">
        <div>
          <h3>Ko-fi</h3>
          <p>Card or PayPal, from anywhere.</p>
        </div>
        <a class="btn primary" id="support-link" target="_blank" rel="noopener">Support on Ko-fi</a>
      </div>
      <div class="support-option qr">
        <div>
          <h3>InstaPay (Philippines)</h3>
          <p>Scan to support with GCash, Maya or your bank app.</p>
        </div>
        <img src="/support/instapay-qr.png" alt="InstaPay QR code to support SwingCheck" width="120" height="120" loading="lazy">
      </div>
    </div>
  </footer>
  <script type="module" src="/app.js"></script>
</body>
</html>
